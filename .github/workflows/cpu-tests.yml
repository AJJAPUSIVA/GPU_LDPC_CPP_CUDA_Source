
name: LDPC CPU Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  cpu-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3

      - name: Show CPU features
        run: |
          lscpu
          grep -m1 '^flags' /proc/cpuinfo || true

      - name: Configure CPU-only build
        run: |B
          cmake -S . -B build-cpu \
            -DNRLDPC_ENABLE_CPU=ON \
            -DNRLDPC_ENABLE_CUDA=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile
        run: cmake --build build-cpu -j 2

      - name: Run correctness tests
        run: ctest --test-dir build-cpu --output-on-failure

      - name: Generate BG2 matrix
        run: python3 tools/generate_5gnr_matrices.py --z 32

      - name: Run AWGN smoke test
        run: |
          ./build-cpu/ldpc_awgn_bench \
            matrices/nr_bg2_z32.txt \
            32 10 1.4 fixed scalar 12345
